<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2f50" />
    <title>Sin conexión · ONO Prop</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7f9;
        color: #17212b;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 520px);
        background: #fff;
        border: 1px solid #dce4ea;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(11, 47, 80, 0.12);
        padding: 32px;
        text-align: center;
      }
      img { width: 88px; height: 88px; border-radius: 18px; }
      h1 { color: #0b2f50; margin-bottom: 12px; }
      p { line-height: 1.55; color: #52616d; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        background: #0b2f50;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="ONO Prop" />
      <h1>Estás sin conexión</h1>
      <p>
        No mostramos información guardada de tu cuenta en esta pantalla. Cuando
        recuperes la conexión podrás continuar usando ONO Prop normalmente.
      </p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
